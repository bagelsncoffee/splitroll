# Builds the Windows installer and publishes a GitHub Release when a version tag is pushed.
#   git tag v1.2.1 && git push origin v1.2.1
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          python3 -m pip install --break-system-packages -q pillow numpy tifffile imagecodecs flask pytest
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(python3 -c "import sys; sys.path.insert(0,'src'); import splitroll; print(splitroll.VERSION)")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != VERSION $V"; exit 1; }
      - name: Tests
        run: python3 -m pytest -q tests
      - name: Build installer
        run: bash packaging/windows/build.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          python3 packaging/release_notes.py "$V" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/splitroll-$V-setup.exe dist/splitroll-$V-setup.exe.sha256 \
            --title "splitroll $V" --notes-file notes.md
      - uses: actions/upload-artifact@v5
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: splitroll-installer
          path: dist/*
